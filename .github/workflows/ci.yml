name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  QT_QPA_PLATFORM: offscreen
  FORMAT_CONVERTERS_CACHE: ${{ github.workspace }}/.corpus-cache
  # the TiLiA release that pyproject.toml pins by its tag
  TILIA_VERSION: "0.7.5"

jobs:
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # PySide6's QtMultimedia, which TiLiA's harmony module imports, needs libpulse
      - name: System libraries for PySide6 (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libopengl0 \
            libpulse-dev libasound2-dev
      - run: pip install -e . pytest
      - name: TiLiA is the pinned version
        run: |
          pip show TiLiA | grep -qx "Version: $TILIA_VERSION"
      - name: Tests (the corpus test has its own job)
        run: pytest -q --ignore=tests/test_corpus.py

  corpus:
    name: corpus test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # PySide6's QtMultimedia, which TiLiA's harmony module imports, needs libpulse
      - name: System libraries for PySide6 (headless)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglib2.0-0 libdbus-1-3 \
            libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libopengl0 \
            libpulse-dev libasound2-dev
      - run: pip install -e . pytest
      - name: TiLiA is the pinned version
        run: |
          pip show TiLiA | grep -qx "Version: $TILIA_VERSION"
      # the downloaded sources and music21's parse of the RomanText files (about 9 minutes on 8 processes);
      # keyed on the pinned source lists
      - uses: actions/cache@v4
        with:
          path: ${{ env.FORMAT_CONVERTERS_CACHE }}
          key: corpus-${{ hashFiles('tests/corpus/sources.json', 'tests/corpus/dcml_files.txt', 'tests/corpus/wir_paths.txt') }}
      - name: Corpus test
        run: pytest -q tests/test_corpus.py
